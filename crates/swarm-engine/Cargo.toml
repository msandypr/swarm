[package]
name = "swarm-engine"
version = "0.1.0"
edition = "2021"
authors = ["Swarm Contributors"]
description = "High-performance segmented download engine"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "stream",
    "http2",
] }

tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "macros",
    "io-util",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
percent-encoding = "2.3"
futures-util = "0.3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
] }
