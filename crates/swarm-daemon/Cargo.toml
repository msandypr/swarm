[package]
name = "swarm-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Swarm Contributors"]
description = "Lightweight Windows Download Manager Daemon"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
] }

tokio = { version = "1", default-features = false, features = [
    "rt",
    "time",
    "sync",
    "macros",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
swarm-engine = { path = "../swarm-engine" }
