<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="header-brand">
        <img src="icons/icon-32.png" alt="Swarm Logo" class="popup-logo">
        <div>
          <h1 class="popup-title">SWARM</h1>
          <span class="popup-subtitle">Download Interceptor</span>
        </div>
      </div>
      <div class="status-pill offline" id="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Checking</span>
      </div>
    </div>

    <!-- Toggle Intercept -->
    <div class="toggle-card">
      <div class="toggle-info">
        <span class="toggle-title">Intercept Downloads</span>
        <span class="toggle-desc">Automatically send browser downloads to Swarm</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-intercept" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Auto-Sync Status Info -->
    <div class="auto-sync-card">
      <div class="sync-row">
        <span class="sync-label">Daemon</span>
        <span class="sync-val" id="port-info">127.0.0.1:52417</span>
      </div>
      <div class="sync-row">
        <span class="sync-label">Pairing</span>
        <span class="sync-val active">Auto Connected</span>
      </div>
    </div>

    <!-- Open Desktop App -->
    <div class="popup-footer">
      <button class="btn btn-primary btn-block" id="btn-open-app">
        <span>Open Swarm App</span>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
